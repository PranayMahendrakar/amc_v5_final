<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AskMyCFO{% endblock %} · The Ledger</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700;9..144,800&family=Manrope:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner">
      <a href="{{ url_for('index') }}" class="brand">
        <span class="brand-mark">A&shy;M&shy;C</span>
        <span class="brand-name">AskMyCFO</span>
        <span class="brand-tag">— The Ledger</span>
      </a>
      <nav class="masthead-nav">
        <a href="{{ url_for('index') }}">Upload</a>
        <a href="{{ url_for('jobs') }}">Archive</a>
        <span class="edition">Vol.&nbsp;1 · No.&nbsp;1 · {{ "today"|upper if false else "" }}<time datetime="2025">FY 2024-25</time></span>
      </nav>
    </div>
    <div class="masthead-rule"></div>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="colophon">
    <div class="colophon-inner">
      <span>AskMyCFO · Geometry-first PDF extraction · Zero LLM, fully deterministic</span>
      <span class="dot">·</span>
      <a href="{{ url_for('healthz') }}">healthz</a>
    </div>
  </footer>

  {% block scripts %}{% endblock %}
</body>
</html>
